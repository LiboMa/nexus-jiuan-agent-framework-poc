<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="t d">
  <title id="t">九安 × Nexus PoC 系统总览</title>
  <desc id="d">浏览器和编码工具经 CloudFront 访问 EC2 上的九安服务端（开发包副本 + 补丁，数据在本机 MySQL）和 PoC 插件；PoC 插件经 A2A 调用 Nexus 上的两个 Agent，经 REST 读每个账号的发布列表；本机的 deploy.sh 把构件和密钥经 S3 装到 EC2。CloudFront 到 EC2 这一段现在是明文 HTTP。</desc>
  <!-- 手工绘制，不由 build-html.sh 生成。改这张图直接改本文件；配色和其他图一致。 -->
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #1D2430; }
    .t { font-size: 15px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #4A5463; }
    .m { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #4A5463; }
    .lbl { font-size: 12px; fill: #4A5463; }
    .warn { font-size: 12px; fill: #A3241C; font-weight: 600; }
    .box { fill: #FCFCFD; stroke: #A9B3C1; }
    .zone { fill: #F0F2F5; stroke: #A9B3C1; }
    .poc { fill: #FCFCFD; stroke: #1F5AA8; }
    .jiuan { fill: #EEF1F5; stroke: #5E6878; }
    .nexus { fill: #E5ECF7; stroke: #1F5AA8; }
    .disk { fill: #E3F2EB; stroke: #1E7F5C; }
    .secret { fill: #F7E4E2; stroke: #A3241C; }
    .wire { fill: none; stroke: #5E6878; stroke-width: 1.6; }
    .flow { fill: none; stroke: #1F5AA8; stroke-width: 2.4; stroke-dasharray: 7 6; animation: march 1.1s linear infinite; }
    .plain { fill: none; stroke: #A3241C; stroke-width: 2.4; stroke-dasharray: 7 6; animation: march 1.1s linear infinite; }
    .deploy { fill: none; stroke: #8A5A12; stroke-width: 1.6; stroke-dasharray: 3 4; }
    @keyframes march { to { stroke-dashoffset: -26; } }
    @media (prefers-reduced-motion: reduce) { .flow, .plain { animation: none; } }
  </style>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5AA8"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3241C"/></marker>
    <marker id="a-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A5A12"/></marker>
  </defs>

  <!-- 使用者 -->
  <rect class="box" x="20" y="40" width="200" height="74" rx="4"/>
  <text class="t" x="36" y="68">浏览器</text>
  <text class="s" x="36" y="92">审核员 · 复核人（虚构账号）</text>
  <rect class="box" x="20" y="140" width="200" height="88" rx="4"/>
  <text class="t" x="36" y="168">编码工具</text>
  <text class="s" x="36" y="190">Claude Code · Codex · Kiro</text>
  <text class="m" x="36" y="212">agent_access.py</text>

  <!-- CloudFront -->
  <rect class="box" x="276" y="70" width="170" height="124" rx="4"/>
  <text class="t" x="292" y="98">CloudFront</text>
  <text class="s" x="292" y="122">andon-finance</text>
  <text class="s" x="292" y="140">.tinyboat.blog</text>
  <text class="s" x="292" y="164">不缓存 · 回源 60 秒</text>
  <text class="s" x="292" y="182">TLS 到这里为止</text>

  <!-- EC2 -->
  <rect class="zone" x="500" y="20" width="370" height="490" rx="6"/>
  <text class="t" x="518" y="46">EC2 andon-finance-poc</text>
  <text class="s" x="518" y="66">t3.large · AL2023 · Node 24 · Docker · 不开 22 端口</text>
  <rect class="jiuan" x="518" y="82" width="334" height="70" rx="4"/>
  <text class="t" x="534" y="108">九安服务端 v0.5.3（开发包副本 + 补丁）</text>
  <text class="s" x="534" y="132">会话 · CSRF · 单据 · 预审 · 平台中心 · 流水线</text>
  <rect class="poc" x="518" y="164" width="334" height="118" rx="4"/>
  <text class="t" x="534" y="190">PoC 插件（platformRoutes 钩子）</text>
  <text class="m" x="534" y="214">审批流     /poc/approvals/*</text>
  <text class="m" x="534" y="236">我的 Nexus /poc/nexus/me*</text>
  <text class="m" x="534" y="258">调用测试   /poc/nexus/invoke · /runs</text>
  <rect class="poc" x="518" y="294" width="334" height="58" rx="4"/>
  <text class="t" x="534" y="318">前端副本</text>
  <text class="s" x="534" y="340">九安原前端 + 锚点补丁 + nexus-poc.js</text>
  <rect class="disk" x="518" y="364" width="334" height="58" rx="4"/>
  <text class="t" x="534" y="388">磁盘 users/&lt;账号&gt;/</text>
  <text class="s" x="534" y="410">连接 · 启用（调用密钥 AES-256-GCM 加密）· 留痕</text>
  <rect class="disk" x="518" y="434" width="334" height="58" rx="4"/>
  <text class="t" x="534" y="458">MySQL 8.0（Docker，127.0.0.1:3306）</text>
  <text class="s" x="534" y="480">库 jiuan_analysis：单据、平台存储、来单原文</text>

  <!-- Nexus -->
  <rect class="zone" x="930" y="20" width="170" height="490" rx="6"/>
  <text class="t" x="946" y="46">Nexus</text>
  <text class="s" x="946" y="66">nxs-beine1013 · v0.3.28</text>
  <rect class="nexus" x="944" y="82" width="142" height="100" rx="4"/>
  <text class="t" x="956" y="106">九安审核AI</text>
  <text class="m" x="956" y="128">pub_5c53e70d…</text>
  <text class="s" x="956" y="150">审批建议 · 草稿核验</text>
  <text class="s" x="956" y="170">审批流用 · 各自启用</text>
  <rect class="nexus" x="944" y="194" width="142" height="116" rx="4"/>
  <text class="t" x="956" y="218">九安知识Agent</text>
  <text class="m" x="956" y="240">pub_2cc24c29…</text>
  <text class="s" x="956" y="262">describe · answer</text>
  <text class="s" x="956" y="282">select · propose</text>
  <text class="s" x="956" y="300">suggest_rules</text>
  <rect class="box" x="944" y="322" width="142" height="62" rx="4"/>
  <text class="t" x="956" y="346">REST /api/v2</text>
  <text class="s" x="956" y="368">发布与 Agent 列表</text>
  <text class="s" x="946" y="414">线上 Nexus AI：</text>
  <text class="m" x="946" y="434">d3u3hj2us186y</text>
  <text class="m" x="946" y="452">.cloudfront.net</text>

  <!-- 部署 -->
  <rect class="box" x="20" y="318" width="200" height="104" rx="4"/>
  <text class="t" x="36" y="346">本机</text>
  <text class="m" x="36" y="370">deploy.sh</text>
  <rect class="secret" x="36" y="382" width="168" height="28" rx="3"/>
  <text class="m" x="46" y="401">secrets.env（0600）</text>
  <rect class="box" x="276" y="318" width="170" height="104" rx="4"/>
  <text class="t" x="292" y="346">S3 构件桶</text>
  <text class="m" x="292" y="370">releases/current.tgz</text>
  <text class="m" x="292" y="390">releases/archive/</text>
  <text class="m" x="292" y="410">secrets/secrets.env</text>

  <!-- 请求：浏览器、编码工具 → CloudFront → EC2 -->
  <path class="flow" d="M220,77 C250,77 250,110 274,110" marker-end="url(#a-blue)"/>
  <path class="flow" d="M220,184 C250,184 250,154 274,154" marker-end="url(#a-blue)"/>
  <text class="lbl" x="232" y="64">HTTPS</text>
  <path class="plain" d="M446,132 L498,132" marker-end="url(#a-red)"/>
  <text class="warn" x="448" y="122">HTTP</text>
  <text class="warn" x="446" y="154">明文</text>
  <!-- EC2 → Nexus -->
  <path class="flow" d="M852,200 C895,200 900,132 942,132" marker-end="url(#a-blue)"/>
  <path class="flow" d="M852,224 C895,224 900,250 942,250" marker-end="url(#a-blue)"/>
  <text class="lbl" x="874" y="160">A2A</text>
  <path class="wire" d="M852,250 C895,250 900,352 942,352" marker-end="url(#a-blue)"/>
  <text class="lbl" x="872" y="330">REST</text>
  <!-- 部署 -->
  <path class="deploy" d="M220,370 L274,370" marker-end="url(#a-brown)"/>
  <path class="deploy" d="M446,370 L498,370" marker-end="url(#a-brown)"/>
  <text class="lbl" x="452" y="360">SSM</text>

  <!-- 图例 -->
  <g transform="translate(20,540)">
    <path class="flow" d="M0,10 L44,10"/>
    <text class="lbl" x="54" y="14">请求（线在流动：方向）</text>
    <path class="plain" d="M230,10 L274,10"/>
    <text class="lbl" x="284" y="14">CloudFront → 源站是明文 HTTP（评审 C2）</text>
    <path class="deploy" d="M560,10 L604,10"/>
    <text class="lbl" x="614" y="14">部署：deploy.sh → S3 → SSM 让实例拉取、重启</text>
    <rect class="secret" x="0" y="34" width="44" height="18" rx="3"/>
    <text class="lbl" x="54" y="48">启动配置只在本机这份文件里，经加密的构件桶装到实例；Agent 密钥在前端启用</text>
    <rect class="disk" x="560" y="34" width="44" height="18" rx="3"/>
    <text class="lbl" x="614" y="48">重启不丢；实例被替换才会丢</text>
  </g>
</svg>
