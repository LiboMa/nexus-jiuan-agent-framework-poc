<svg width="640" height="520" id="fig-review-quadrant" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style=" background-color: transparent;" viewBox="0 0 640 520" role="graphics-document document" aria-roledescription="quadrantChart"><style>@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style><style>#fig-review-quadrant{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans SC,sans-serif;font-size:14px;fill:#1D2430;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fig-review-quadrant .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fig-review-quadrant .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fig-review-quadrant .error-icon{fill:#F0F2F5;}#fig-review-quadrant .error-text{fill:#1D2430;stroke:#1D2430;}#fig-review-quadrant .edge-thickness-normal{stroke-width:1px;}#fig-review-quadrant .edge-thickness-thick{stroke-width:3.5px;}#fig-review-quadrant .edge-pattern-solid{stroke-dasharray:0;}#fig-review-quadrant .edge-thickness-invisible{stroke-width:0;fill:none;}#fig-review-quadrant .edge-pattern-dashed{stroke-dasharray:3;}#fig-review-quadrant .edge-pattern-dotted{stroke-dasharray:2;}#fig-review-quadrant .marker{fill:#5E6878;stroke:#5E6878;}#fig-review-quadrant .marker.cross{stroke:#5E6878;}#fig-review-quadrant svg{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans SC,sans-serif;font-size:14px;}#fig-review-quadrant p{margin:0;}#fig-review-quadrant .node .neo-node{stroke:#A9B3C1;}#fig-review-quadrant [data-look="neo"].node rect,#fig-review-quadrant [data-look="neo"].cluster rect,#fig-review-quadrant [data-look="neo"].node polygon{stroke:url(#fig-review-quadrant-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fig-review-quadrant [dat