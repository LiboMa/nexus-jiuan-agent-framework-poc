idth: 2;"/><line x1="635" y1="6" x2="635" y2="488" style="stroke: rgb(169, 179, 193); stroke-width: 2;"/><line x1="30" y1="489" x2="636" y2="489" style="stroke: rgb(169, 179, 193); stroke-width: 2;"/><line x1="31" y1="6" x2="31" y2="488" style="stroke: rgb(169, 179, 193); stroke-width: 2;"/><line x1="333" y1="6" x2="333" y2="488" style="stroke: rgb(252, 252, 253); stroke-width: 1;"/><line x1="32" y1="247" x2="634" y2="247" style="stroke: rgb(252, 252, 253); stroke-width: 1;"/></g><g class="data-points"><g class="data-point"><circle cx="320.92" cy="208.28000000000003" r="6" fill="#1D2430" stroke="#1D2430" stroke-width="0px"/><text x="0" y="0" fill="#1D2430" font-size="13" dominant-baseline="hanging" text-anchor="middle" transform="translate(320.92, 213.28000000000003) rotate(0)">I11 主机打补丁</text></g><g class="data-point"><circle cx="514.2" cy="159.88" r="6" fill="#1D2430" stroke="#1D2430" stroke-width="0px"/><text x="0" y="0" fill="#1D2430" font-size="13" dominant-baseline="hanging" text-anchor="middle" transform="translate(514.2, 164.88) rotate(0)">I10 预发环境</text></g><g class="data-point"><circle cx="284.68" cy="324.43999999999994" r="6" fill="#1D2430" stroke="#1D2430" stroke-width="0px"/><text x="0" y="0" fill="#1D2430" font-size="13" dominant-baseline="hanging" text-anchor="middle" transform="translate(284.68, 329.43999999999994) rotate(0)">I9 Node 24 / Py 3.9</text></g><g class="data-point"><circle cx="212.2" cy="295.4" r="6" fill="#1D2430" stroke="#1D2430" stroke-width="0px"/><text x="0" y="0" fill="#1D2430" font-size="13" dominant-baseline="hanging" text-anchor="middle" transform="translate(212.2, 300.4) rotate(0)">I8 operator 钉版本</text></g><g class="data-point"><circle cx="272.6" cy="266.36" r="6" fill="#1D2430" stroke="#1D2430" stroke-width="0px"/><text x="0" y="0" fill="#1D2430" font-size="13" dominant-baseline="hanging" text-anchor="middle" transform="translate(272.6, 271.36) rotate(0)">I7 补丁名字检查</text></g><g class="data-point"><circle cx="405.47999999999996