<!doctype html>
<html lang="zh-CN" data-mode="snapshot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>开发进度 · 九安 × Nexus PoC</title>
<style>/* 开发进度看板。配色和交付文档一致（公文抬头、蓝色强调）；阶段是一条蓝色的有序色阶（浅 → 深），
   受阻和「声称完成但测试没过」用保留的状态色，并且总带图标和文字，不只靠颜色。 */
:root{
  --paper:#F4F5F7; --sheet:#FCFCFD; --ink:#1D2430; --ink-2:#4A5463; --ink-3:#5E6878; --line:#A9B3C1; --hair:#D9DEE5;
  --accent:#1F5AA8; --seal:#C8352C;
  --s-todo:#E9EEF6; --s-doing:#B7CAE8; --s-testing:#6F93CC; --s-done:#1F5AA8; --s-blocked:#C8352C; --s-conflict:#E07B3F;
  --good:#1E7F5C; --good-wash:#E3F2EB; --bad:#A3241C; --bad-wash:#F7E4E2; --warn:#8A5A12; --warn-wash:#F8EEDC;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --unit:54px;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.86em;background:rgba(29,36,48,.06);padding:.05em .3em;border-radius:3px;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{max-width:1480px;margin:0 auto;padding:28px 28px 64px}

/* 抬头 */
.head{background:var(--sheet);border:1px solid var(--line);padding:22px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:start}
.head h1{margin:0;font:700 26px/1.3 var(--sans);letter-spacing:.02em}
.head .project{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.mode{justify-self:start;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);border:1px solid var(--line);padding:3px 10px;border-radius:999px;background:#fff;white-space:nowrap}
.mode .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.mode.live .dot{background:var(--good);box-shadow:0 0 0 0 rgba(30,127,92,.5);animation:live 2s ease-out infinite}
.mode.stale .dot{background:var(--seal);animation:none}
@keyframes live{to{box-shadow:0 0 0 7px rgba(30,127,92,0)}}
.signals{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.signal{display:inline-flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--hair);background:#fff;padding:3px 10px;border-radius:3px}
.signal b{font-weight:600}
.signal .i{font-weight:700}
.signal.ok{border-color:#B9DCCB}.signal.ok .i{color:var(--good)}
.signal.bad{border-color:#E8B7B2;background:var(--bad-wash)}.signal.bad .i{color:var(--bad)}
.signal.warn{border-color:#E6CFA6;background:var(--warn-wash)}.signal.warn .i{color:var(--warn)}
.signal.none .i{color:var(--ink-3)}
.problems{margin:12px 0 0;padding:10px 14px;border-left:4px solid var(--seal);background:var(--bad-wash);font-size:14px}
.problems.warnings{border-color:var(--warn);background:var(--warn-wash)}
.problems ul{margin:4px 0 0;padding-left:1.2em}

/* 总览：完成度、按阶段的范围、里程碑 */
.summary{display:grid;grid-template-columns:auto minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:center;margin-top:18px;background:var(--sheet);border:1px solid var(--line);padding:20px 26px}
.hero{display:flex;flex-direction:column}
.hero .n{font:700 52px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero .n small{font-size:24px;font-weight:600;margin-left:2px}
.hero .l{font-size:13px;color:var(--ink-2);margin-top:6px}
.stack{display:flex;gap:2px;height:16px;margin:4px 0 10px}
.stack span{display:block;height:100%;min-width:2px}
.stack span:first-child{border-radius:4px 0 0 4px}.stack span:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.legend li{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid rgba(29,36,48,.15)}
.milestones{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.milestone{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:2px 10px;font-size:13px}
.milestone .bar{grid-column:1 / -1;height:6px;background:var(--hair);border-radius:3px;overflow:hidden}
.milestone .bar i{display:block;height:100%;background:var(--s-done);border-radius:3px}
.milestone .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* 筛选 */
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:18px 0 0;font-size:13px}
.filters label{color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.filters select,.filters input[type=search]{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
.filters input[type=search]{width:12em}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;padding:2px 9px;border-radius:999px;cursor:pointer;font-size:13px}
.chip[aria-pressed=false]{opacity:.45;text-decoration:line-through}
.views{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.views button{border:0;background:#fff;padding:4px 12px;cursor:pointer;font-size:13px}
.views button[aria-pressed=true]{background:var(--ink);color:#fff}

/* 地图与详情 */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;margin-top:14px;align-items:start}
/* 分区高矮不一：用多栏排，像砌砖一样紧凑，不留大块空白 */
.map{columns:2 380px;column-gap:14px}
.zone{background:var(--sheet);border:1px solid var(--line);padding:14px 14px 12px;break-inside:avoid;margin:0 0 14px;display:inline-block;width:100%}
.zone-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.zone-head h2{margin:0;font:600 16px/1.4 var(--sans)}
.zone-head .pct{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.zone-head .goal{grid-column:1 / -1;margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.5}
.zone-bar{height:4px;background:var(--hair);border-radius:2px;margin:8px 0 10px;overflow:hidden}
.zone-bar i{display:block;height:100%;background:var(--s-done)}
.blocks{display:flex;flex-wrap:wrap;gap:6px}
.block{position:relative;flex:var(--size) 1 calc(var(--size) * var(--unit) + 56px);min-height:76px;text-align:left;border:1px solid rgba(29,36,48,.18);border-radius:4px;
  padding:7px 9px 6px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:4px;transition:opacity .15s,box-shadow .15s}
.block .name{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.block .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:11.5px;line-height:1.4}
.block .badge{display:inline-flex;gap:3px;align-items:center;padding:0 5px;border-radius:2px;background:rgba(255,255,255,.82);color:var(--ink)}
.block .badge.fail{background:#fff;color:var(--bad);font-weight:600}
.block .badge.wait{background:rgba(255,255,255,.7);color:var(--ink-2)}
.s-todo{background-color:var(--s-todo);color:var(--ink);border:1.5px dashed var(--ink-3);
  background-image:repeating-linear-gradient(135deg,rgba(94,104,120,.13) 0 2px,transparent 2px 7px)}
.s-doing{background:var(--s-doing);color:var(--ink)}
.s-testing{background:var(--s-testing);color:var(--ink)}
.s-done{background:var(--s-done);color:#fff}
.s-blocked{background:var(--s-blocked);color:#fff}
.block.conflict{box-shadow:inset 0 0 0 3px var(--s-conflict)}
.block.conflict::after{content:"!";position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--s-conflict);color:var(--ink);font:700 12px/18px var(--sans);text-align:center}
.block.dim{opacity:.18}
.block.faded{opacity:.3}
.block.up{box-shadow:0 0 0 3px var(--ink)}
.block.down{outline:2px dashed var(--ink);outline-offset:2px}
.block.selected{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--seal)}
.block.changed{animation:changed 1.4s ease-out 1}
@keyframes changed{0%{box-shadow:0 0 0 0 rgba(200,53,44,.7)}100%{box-shadow:0 0 0 14px rgba(200,53,44,0)}}

.panel{position:sticky;top:16px;background:var(--sheet);border:1px solid var(--line);padding:18px 18px 16px;max-height:calc(100vh - 32px);overflow:auto}
.panel .crumb{margin:0;font-size:12.5px;color:var(--ink-3)}
.panel h3{margin:2px 0 8px;font:600 18px/1.4 var(--sans)}
.panel .tag{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;padding:1px 8px;border-radius:2px;margin:0 6px 6px 0}
.panel dl{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:6px 10px;margin:10px 0 0;font-size:13.5px}
.panel dt{color:var(--ink-3)}
.panel dd{margin:0}
.panel h4{margin:16px 0 6px;font:600 13.5px/1.4 var(--sans);color:var(--ink-2)}
.panel ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13.5px}
.panel li{display:flex;gap:8px;align-items:baseline}
.panel .note{margin:10px 0 0;padding:8px 10px;font-size:13px;border-left:3px solid var(--line);background:#fff}
.panel .note.blocked{border-color:var(--s-blocked);background:var(--bad-wash)}
.panel .note.conflict{border-color:var(--s-conflict);background:var(--warn-wash)}
.panel .empty{color:var(--ink-3);font-size:14px;margin:0}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.icon{width:1.1em;text-align:center;flex:none}
.progress{height:6px;background:var(--hair);border-radius:3px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--s-done)}

/* 表格视图 */
.table-wrap{background:var(--sheet);border:1px solid var(--line);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--hair);padding:7px 10px;text-align:left;vertical-align:top}
thead th{background:#EEF1F5;color:var(--ink-2);font-weight:600;position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F0F4FA}
tbody tr.dim{display:none}
.num{text-align:right;font-variant-numeric:tabular-nums}

.tooltip{position:fixed;z-index:30;pointer-events:none;max-width:320px;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.5;padding:8px 10px;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.tooltip[hidden]{display:none}
footer{margin-top:40px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}

@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .panel{position:static;max-height:none}
  .summary{grid-template-columns:auto minmax(0,1fr)}
  .summary .milestones{grid-column:1 / -1}
}
@media (max-width:640px){
  .page{padding:16px 12px 48px}
  .head{grid-template-columns:minmax(0,1fr);padding:16px}
  .summary{grid-template-columns:minmax(0,1fr);padding:16px}
  .map{columns:1}
  .views{margin-left:0}
  :root{--unit:40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.filters,.tooltip,.views{display:none}.layout{grid-template-columns:1fr}.panel{position:static}}
</style>
</head>

    <div>
      <h1>开发进度</h1>
      <p class="project" id="project"></p>
    </div>
    <span class="mode" id="mode" role="status"><span class="dot"></span>正在读取</span>

    <ul class="milestones" id="milestones" aria-label="里程碑"></ul>

  <div class="filters" role="group" aria-label="筛选">

      <button type="button" data-view="map" aria-pressed="true">色块地图</button>
      <button type="button" data-view="table" aria-pressed="false">表格</button>
    </span>
  </div>
  <div class="layout">
    <main>
      <div class="map" id="map"></div>
      <div id="table" hidden></div>

    <aside class="panel" id="panel" aria-live="polite"></aside>

  <footer>数据来源：<code>progress.json</code>（清单，人或编码工具维护）+ 自动信号（单元测试、端到端、文档、线上健康）。实时看：<code>node tools/progress/serve.mjs</code>；快照：<code>node tools/progress/snapshot.mjs</code>。</footer>
</div>

      el('td', { text: module.dependsOn.join('、') || '—' }), el('td', { text: milestoneName(module.milestone) }), el('td', { text: module.owner ?? '—' })));
    put($('table'), el('div', { class: 'table-wrap' }, el('table', {},
      el('thead', {}, el('tr', {}, ['能力', '模块', '状态', '范围', '进度', '测试', '依赖', '里程碑', '负责人'].map(text => el('th', { text })))),
      el('tbody', {}, rows))));
  }

  // ---------- 详情
  function select(id) {
    ui.selected = id;
    renderMap();
    renderPanel();
    if (ui.view === 'table') renderTable();
  }
  function moduleLinks(ids) {
    const index = byId();
    if (!ids.length) return el('p', { class: 'empty', text: '无' });
    return el('ul', {}, ids.map(id => {
      const module = index.get(id);
      return el('li', {}, el('span', { class: 'icon', text: module ? ICON[module.status] : '?' }),
        module ? el('button', { class: 'link', type: 'button', text: module.name, onclick: () => select(id) }) : el('span', { text: id }),
        module ? el('span', { style: { color: 'var(--ink-3)' } }, ` ${LABEL[module.status]}`) : null);
    }));
  }
  function renderPanel() {
    const module = ui.selected ? byId().get(ui.selected) : null;
    const panel = $('panel');
    if (!module) {
      put(panel, el('p', { class: 'crumb', text: '详情' }), el('h3', { text: '点一个色块看详情' }),
        el('p', { class: 'empty', text: '每个色块是一个模块：面积是范围大小，颜色是阶段。悬停看依赖：实线框是它依赖的，虚线框是依赖它的。' }));
      return;
    }
    const tone = module.status === 'done' || module.status === 'blocked' ? '#fff' : 'var(--ink)';
    put(panel, 
      el('p', { class: 'crumb', text: module.capabilityName }),
      el('h3', { text: module.name }),
      el('span', { class: `tag s-${module.status}`, style: { color: tone } }, `${ICON[module.status]} ${LABEL[module.status]}`),
      module.conflict ? el('span', { class: 'tag', style: { background: 'var(--s-conflict)' } }, '! 测试没过') : null,
      el('div', { class: 'progress' }, el('i', { style: { width: pct(module.progress) } })),
      el('dl', {},
        el('dt', { text: '编号' }), el('dd', {}, el('code', { text: module.id })),
        el('dt', { text: '进度' }), el('dd', { text: `${pct(module.progress)}${module.tasks.length ? `（${module.tasks.filter(task => task.status === 'done').length}/${module.tasks.length} 项）` : ''}` }),
        el('dt', { text: '范围' }), el('dd', { text: String(module.size) }),
        el('dt', { text: '里程碑' }), el('dd', { text: milestoneName(module.milestone) }),
        el('dt', { text: '负责人' }), el('dd', { text: module.owner ?? '—' }),
        el('dt', { text: '测试' }), el('dd', { text: module.tests ? `${testsText(module.tests)}${module.tests.missing ? `，${module.tests.missing} 个文件没跑到` : ''}` : module.testFiles.length ? '还没收集' : '没有声明测试' })),
      module.blockedReason ? el('p', { class: 'note blocked' }, el('b', { text: '受阻：' }), module.blockedReason) : null,
      module.conflict ? el('p', { class: 'note conflict', text: '清单里写的是完成，但这个模块的测试没有全部通过：先修测试，或把状态改回「进行中」。' }) : null,
      module.notes ? el('p', { class: 'note', text: module.notes }) : null,
      module.evidence ? el('p', { class: 'note' }, el('b', { text: '证据：' }), module.evidence) : null,
      module.tasks.length ? [el('h4', { text: '细项' }), el('ul', {}, module.tasks.map(task => el('li', {}, el('span', { class: 'icon', text: ICON[task.status] }), el('span', { text: task.title }), el('span', { style: { color: 'var(--ink-3)' } }, ` ${LABEL[task.status]}`))))] : null,
      el('h4', { text: '它依赖的' }), moduleLinks(module.dependsOn),
      el('h4', { text: '依赖它的' }), moduleLinks(module.dependents),
      module.waitingOn.length ? [el('h4', { text: '还在等（依赖没完成）' }), moduleLinks(module.waitingOn)] : null,
      module.testFiles.length ? [el('h4', { text: '测试文件' }), el('ul', {}, module.testFiles.map(file => el('li', {}, el('code', { text: file }))))] : null,
      (module.paths ?? []).length ? [el('h4', { text: '代码' }), el('ul', {}, module.paths.map(file => el('li', {}, el('code', { text: file }))))] : null);
  }

  function renderAll() {
    renderHead();
    renderSummary();
    renderFilters();
    $('map').hidden = ui.view !== 'map';
    $('table').hidden = ui.view !== 'table';
    if (ui.view === 'map') renderMap(); else renderTable();
    renderPanel();
  }

  // ---------- 事件
  $('f-milestone').addEventListener('change', event => { ui.milestone = event.target.value; renderAll(); });
  $('f-owner').addEventListener('change', event => { ui.owner = event.target.value; renderAll(); });
  $('f-query').addEventListener('input', event => { ui.query = event.target.value.trim().toLowerCase(); renderAll(); });
  for (const button of document.querySelectorAll('.views button')) button.addEventListener('click', () => { ui.view = button.dataset.view; renderAll(); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && ui.selected) select(null); });

  function load(state) {
    ui.state = state;
    if (ui.selected && !byId().has(ui.selected)) ui.selected = null;
    renderAll();
  }
  if (mode === 'snapshot') {
    load(JSON.parse($('progress-state').textContent));
  } else {
    const modeNode = $('mode');
    fetch('/api/state').then(res => res.json()).then(load).catch(() => {});
    const source = new EventSource('/api/events');
    source.addEventListener('state', event => { modeNode.className = 'mode live'; load(JSON.parse(event.data)); });
    source.addEventListener('open', () => { modeNode.className = 'mode live'; if (ui.state) renderHead(); });
    source.addEventListener('error', () => { modeNode.className = 'mode stale'; if (ui.state) renderHead(); });
  }
})();

</script>
</body>
</html>
