openapi: 3.1.0
info:
  title: 九安审批工作流（AI 初审 + 人工复核）参考接口
  version: 1.0.0
  description: |
    九安服务端给九安前端用的接口，参考实现。审核 Agent 不调用这些接口，也不知道它们。
    前缀与九安原有接口相同（/api/analysis/v1），会话、Origin、CSRF 沿用九安：
    Cookie `jiuan_analysis`，非 GET 请求带头 `x-csrf-token`。
    这是第一个用到 Agent 接入框架的业务流程（审批流：九安预审 → AI 步骤 first_review → 人工复核）。
    状态机见 docs/delivery/agent-framework.md 第 5 节；任务契约见 contract/tasks/first_review/v1/。
servers:
  - url: /api/analysis/v1
security:
  - session: []
paths:
  /documents/{documentId}/first-review:
    parameters:
      - $ref: '#/components/parameters/documentId'
    get:
      summary: 读一张单据当前这一轮审批
      responses:
        '200':
          description: 当前一轮；从来没有发起过时 status 为 not_started
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/FirstReviewView' } } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: 人对这一轮审批做的操作（发起、重试 AI、转人工、按新规则重跑）
      description: |
        来单自动发起不走这个接口，由九安平台的流水线一站（audit.first-review）以系统身份发起。
        start：当前没有进行中的一轮时发起；retry：AI 初审失败后重试；manual：不等 AI，直接转人工复核；
        rerun：「规则已更新」或「原件已更新」时，按最新的已发布规则和原件重跑 AI 初审（原来的结果保留在留痕里）。
      parameters:
        - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, sourceVersion]
              properties:
                action: { enum: [start, retry, manual, rerun] }
                sourceVersion: { $ref: '#/components/schemas/SourceVersion' }
      responses:
        '202':
          description: 已受理；AI 初审在后台跑，页面轮询 GET
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/FirstReviewView' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /documents/{documentId}/first-review/decision:
    parameters:
      - $ref: '#/components/parameters/documentId'
    post:
      summary: 人工复核：通过或退回，一步结束
      description: |
        九安的 admin 或 analyst，并且能看这家公司。
        只在 pending_review 时可用。和 AI 初审的综合结论相反时必须写 reason；退回必须写 returnNote。
        决定只记在九安里，不回写汇联易。
      parameters:
        - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, sourceVersion]
              properties:
                decision: { enum: [approve, return] }
                sourceVersion: { $ref: '#/components/schemas/SourceVersion' }
                reason: { type: string, maxLength: 1000, description: 和 AI 初审结论相反时必填 }
                returnNote: { type: string, maxLength: 1000, description: 退回时必填，给业务看的退回说明 }
      responses:
        '200':
          description: 已记录，这一轮结束
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/FirstReviewView' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /first-review/summaries:
    get:
      summary: 单据池卡片用的摘要（一次最多 50 张）
      parameters:
        - name: documentIds
          in: query
          required: true
          description: 逗号分隔
          schema: { type: string, maxLength: 9000 }
      responses:
        '200':
          description: 每张单据一条；没有发起过的不出现
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: object
                        additionalProperties: { $ref: '#/components/schemas/FirstReviewSummary' }
        '400': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: jiuan_analysis
  parameters:
    documentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,160}$' }
    csrf:
      name: x-csrf-token
      in: header
      required: true
      schema: { type: string }
  responses:
    Error:
      description: 九安统一的错误格式
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    description: |
                      INVALID_REQUEST、NOT_FOUND、ANALYSIS_SOURCE_CHANGED（单据版本对不上）、
                      FIRST_REVIEW_ACTION_NOT_ALLOWED（当前状态不能做这个操作）、FIRST_REVIEW_STATE_CONFLICT（别人刚改过，重读再试）、
                      FIRST_REVIEW_REASON_REQUIRED（422：缺理由或退回说明）、FIRST_REVIEW_RATE_LIMIT（429）
                  message: { type: string }
  schemas:
    SourceVersion: { type: string, pattern: '^[a-f0-9]{64}$' }
    Status:
      enum: [not_started, prechecking, ai_running, ai_failed, pending_review, approved, returned, invalidated]
      description: 未发起、预审中、AI 初审中、AI 初审失败、待人工复核、已通过、已退回、已失效
    FirstReviewSummary:
      type: object
      required: [status, statusLabel, aiResult, rulesUpdated, evidenceUpdated]
      properties:
        status: { $ref: '#/components/schemas/Status' }
        statusLabel: { type: string }
        aiResult: { enum: [pass, fail, null], description: AI 初审综合结论；还没有就是 null }
        rulesUpdated: { type: boolean }
        evidenceUpdated: { type: boolean }
    FirstReviewView:
      type: object
      required: [documentId, sourceVersion, status, statusLabel, round, steps, ai, failure, rulesUpdated, evidenceUpdated, actions, history]
      properties:
        documentId: { type: string }
        sourceVersion: { $ref: '#/components/schemas/SourceVersion' }
        status: { $ref: '#/components/schemas/Status' }
        statusLabel: { type: string }
        round: { type: integer, minimum: 0, description: 第几轮审批；单据版本变化或重跑都会开新的一轮 }
        auto: { type: boolean, description: 这一轮是不是来单时系统自动发起的 }
        steps:
          type: array
          description: 来单 / 发起、九安预审、AI 初审、人工复核，四步各自的状态
          items:
            type: object
            required: [key, label, state]
            properties:
              key: { enum: [start, precheck, ai, review] }
              label: { type: string }
              state: { enum: [pending, active, done, failed, skipped] }
        ai:
          description: AI 步骤的结果：任务 first_review@1 的 output，加上九安记下的调用信息；没有就是 null
          oneOf:
            - type: 'null'
            - type: object
              required: [task, taskVersion, result, note, rules, agentVersion, publishId, rulesFingerprint, completedAt]
              properties:
                result: { enum: [pass, fail] }
                note: { type: string }
                rules:
                  type: array
                  items:
                    type: object
                    required: [ruleId, ruleVersion, name, result, note]
                    properties:
                      ruleId: { type: string }
                      ruleVersion: { type: integer }
                      name: { type: string, description: 九安补上的规则名称 }
                      result: { enum: [pass, fail] }
                      note: { type: string }
                task: { type: string, description: 'first_review' }
                taskVersion: { type: integer }
                agentVersion: { type: string }
                publishId: { type: string, description: 这次调的是哪个发布 }
                rulesFingerprint: { type: string }
                completedAt: { type: string, format: date-time }
        failure:
          description: AI 初审失败的原因；没有失败就是 null
          oneOf:
            - type: 'null'
            - type: object
              required: [code, message, autoRetried]
              properties:
                stage: { enum: [precheck, ai] }
                code: { type: string, description: 九安模型错误码，见 contract/envelope/v1/error-map.json }
                message: { type: string }
                autoRetried: { type: boolean, description: 系统是否已经自动重试过一次 }
        rulesUpdated: { type: boolean, description: 这一轮用的规则之后又有发布；由人决定要不要 rerun }
        evidenceUpdated: { type: boolean, description: 这一轮之后原件有了新的文字（例如当时没取到）；由人决定要不要 rerun }
        actions:
          type: array
          description: 当前登录的人现在能做的操作
          items: { enum: [start, retry, manual, rerun, decide] }
        decision:
          oneOf:
            - type: 'null'
            - type: object
              required: [decision, by, at]
              properties:
                decision: { enum: [approve, return] }
                by: { type: string }
                at: { type: string, format: date-time }
                reason: { type: string }
                returnNote: { type: string }
        history:
          type: array
          description: 留痕：每次状态变化一条
          items:
            type: object
            required: [action, label, actor, at]
            properties:
              action: { type: string }
              label: { type: string }
              actor: { type: string, description: 人的账号，或 system:pipeline }
              at: { type: string, format: date-time }
