AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  pgvector-rules-kb (create mode): a dedicated private EC2 host for PostgreSQL + pgvector in the Nexus VPC.
  No public IP, no SSH; managed through SSM only. Docker is installed by user data; the container itself is
  started afterwards by deploy.sh (phase db) so that create and existing modes share one code path.
  deploy.sh creates this stack once and never updates it (an update that replaces the instance would lose the data
  on the root volume); it is deleted only by "destroy --purge-data".

Parameters:
  DeployName:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9-]{1,40}$'
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet in the Nexus VPC. Needs a NAT route to pull the container image.
  VpcId:
    Type: AWS::EC2::VPC::Id
  AllowedCidr:
    Type: String
    Description: Source CIDR allowed to reach PostgreSQL (private range only).
    AllowedPattern: '^(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})/(\d|[12]\d|3[0-2])$'
  Port:
    Type: Number
    Default: 5432
  InstanceType:
    Type: String
    Default: t3.medium
  VolumeSizeGb:
    Type: Number
    Default: 30
    MinValue: 10
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Concrete AMI ID, resolved once by deploy.sh (from the AL2023 SSM public parameter) and pinned in the state file.
      Do not use an SSM parameter type here: CloudFormation re-resolves it on every update and a newer AMI would
      replace the instance - the data lives on the root volume.

Resources:
  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${DeployName} PG host - PostgreSQL from private ranges only; no SSH'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref Port
          ToPort: !Ref Port
          CidrIp: !Ref AllowedCidr
          Description: !Sub '${DeployName}: Nexus server + sandbox VMs (private only)'
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: image pulls, OS updates, SSM endpoints
      Tags:
        - { Key: Name, Value: !Sub '${DeployName}-pg-host' }
        - { Key: managed-by, Value: pgvector-rules-kb }

  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Tags:
        - { Key: managed-by, Value: pgvector-rules-kb }

  HostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]

  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref HostSecurityGroup]
      IamInstanceProfile: !Ref HostInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSizeGb
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf -y install docker
          systemctl enable --now docker
      Tags:
        - { Key: Name, Value: !Sub '${DeployName}-pg-host' }
        - { Key: managed-by, Value: pgvector-rules-kb }

Outputs:
  InstanceId:
    Value: !Ref Host
  PrivateIp:
    Value: !GetAtt Host.PrivateIp
  SecurityGroupId:
    Value: !Ref HostSecurityGroup
